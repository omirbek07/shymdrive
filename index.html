<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shymkent Driving Simulator - Mobile Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; color: #fff; font-family: sans-serif; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; pointer-events: none; z-index: 10; max-width: 80%; }
        #error-log { color: #ff5555; }
        
        /* Мобильное управление */
        .controls-container { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; }
        .d-pad, .action-pad { display: flex; gap: 10px; }
        .btn { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.3); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: sans-serif; color: #fff; user-select: none; touch-action: manipulation; }
        .btn:active { background: rgba(255, 255, 255, 0.8); color: #000; }
    </style>

    <!-- Загружаем библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <div id="info">Тулпар 3D<br>FPS: <span id="fps">0</span><br><span id="error-log"></span></div>
    
    <div class="controls-container">
        <div class="d-pad">
            <div id="btn-left" class="btn">◀</div>
            <div id="btn-right" class="btn">▶</div>
        </div>
        <div class="action-pad">
            <div id="btn-brake" class="btn">🛑</div>
            <div id="btn-gas" class="btn">Газ</div>
        </div>
    </div>
    
    <script>
        // ВЫВОДИМ ОШИБКИ НА ЭКРАН ТЕЛЕФОНА
        window.addEventListener('error', function(e) {
            document.getElementById('error-log').innerHTML += 'Ошибка: ' + e.message + ' (строка ' + e.lineno + ')<br>';
        });

        if (typeof THREE === 'undefined' || typeof CANNON === 'undefined') {
            throw new Error('Библиотеки не загрузились (проверьте интернет)');
        }

        // --- 1. ИНИЦИАЛИЗАЦИЯ THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. ИНИЦИАЛИЗАЦИЯ CANNON.JS ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.81, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;

        const groundMat = new CANNON.Material();
        const wheelMat = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(wheelMat, groundMat, { friction: 0.3, restitution: 0 }));

        // --- 3. СОЗДАНИЕ МИРА ---
        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
        world.addBody(groundBody);

        const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x55aa55 }));
        planeMesh.rotation.x = -Math.PI / 2;
        planeMesh.receiveShadow = true;
        scene.add(planeMesh);
        
        const grid = new THREE.GridHelper(300, 150, 0x000000, 0x000000);
        grid.material.opacity = 0.2; grid.material.transparent = true;
        scene.add(grid);

        // --- 4. АВТОМОБИЛЬ ---
        const chassisShape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 2));
        const chassisBody = new CANNON.Body({ mass: 1500, material: groundMat });
        chassisBody.addShape(chassisShape);
        chassisBody.position.set(0, 4, 0);

        const vehicle = new CANNON.RaycastVehicle({ chassisBody: chassisBody });
        
        const positions = [ [-1, 0, -1.2], [1, 0, -1.2], [-1, 0, 1.2], [1, 0, 1.2] ];
        positions.forEach(pos => {
            // Создаем уникальные настройки для КАЖДОГО колеса
            const wheelOptions = {
                radius: 0.5, directionLocal: new CANNON.Vec3(0, -1, 0), suspensionStiffness: 30, suspensionRestLength: 0.3,
                frictionSlip: 5, dampingRelaxation: 2.3, dampingCompression: 4.4, maxSuspensionForce: 100000, rollInfluence: 0.01,
                axleLocal: new CANNON.Vec3(-1, 0, 0), maxSuspensionTravel: 0.3, customSlidingRotationalSpeed: -30, useCustomSlidingRotationalSpeed: true,
                chassisConnectionPointLocal: new CANNON.Vec3(pos[0], pos[1], pos[2])
            };
            vehicle.addWheel(wheelOptions);
        });
        vehicle.addToWorld(world);

        const carMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshLambertMaterial({ color: 0xcc2222 }));
        carMesh.castShadow = true; scene.add(carMesh);

        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMatRender = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const wheelMeshes = positions.map(() => {
            const mesh = new THREE.Mesh(wheelGeo, wheelMatRender);
            scene.add(mesh); return mesh;
        });

        // --- 5. УПРАВЛЕНИЕ ---
        const controls = { forward: false, brake: false, left: false, right: false };

        const bindTouch = (id, prop) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); controls[prop] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); controls[prop] = false; });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); controls[prop] = true; });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); controls[prop] = false; });
        };
        bindTouch('btn-gas', 'forward');
        bindTouch('btn-brake', 'brake');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        // --- 6. ИГРОВОЙ ЦИКЛ ---
        const maxSteer = 0.5, maxForce = 2500, brakeForce = 50;
        let lastTime = performance.now();
        let frames = 0;
        const fpsEl = document.getElementById('fps');

        function animate(time) {
            requestAnimationFrame(animate);
            
            // Считаем FPS безопасно
            frames++;
            if (time - lastTime >= 1000) {
                fpsEl.innerText = frames;
                frames = 0;
                lastTime = time;
            }

            let engineForce = 0, steeringValue = 0;
            if (controls.forward) engineForce = -maxForce;
            
            if (controls.brake) {
                vehicle.setBrake(brakeForce, 0); vehicle.setBrake(brakeForce, 1);
                vehicle.setBrake(brakeForce, 2); vehicle.setBrake(brakeForce, 3);
            } else {
                vehicle.setBrake(0, 0); vehicle.setBrake(0, 1);
                vehicle.setBrake(0, 2); vehicle.setBrake(0, 3);
            }
            
            if (controls.left) steeringValue = maxSteer;
            if (controls.right) steeringValue = -maxSteer;

            vehicle.applyEngineForce(engineForce, 2);
            vehicle.applyEngineForce(engineForce, 3);
            vehicle.setSteeringValue(steeringValue, 0);
            vehicle.setSteeringValue(steeringValue, 1);

            // ИСПОЛЬЗУЕМ ЖЕСТКИЙ ШАГ ВРЕМЕНИ, ЧТОБЫ ИЗБЕЖАТЬ СКАЧКОВ (NaN)
            world.step(1 / 60);

            // Синхронизация графики
            if (!isNaN(chassisBody.position.x)) {
                carMesh.position.copy(chassisBody.position);
                carMesh.quaternion.copy(chassisBody.quaternion);

                for (let i = 0; i < vehicle.wheelInfos.length; i++) {
                    vehicle.updateWheelTransform(i);
                    const transform = vehicle.wheelInfos[i].worldTransform;
                    wheelMeshes[i].position.copy(transform.position);
                    wheelMeshes[i].quaternion.copy(transform.quaternion);
                }

                // Камера
                const camOffset = new THREE.Vector3(0, 4, 10).applyQuaternion(carMesh.quaternion);
                camera.position.lerp(carMesh.position.clone().add(camOffset), 0.1);
                camera.lookAt(carMesh.position);
            }

            renderer.render(scene, camera);
        }
        
        animate(performance.now());

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
