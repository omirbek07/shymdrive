<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shymkent Driving Simulator - Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; color: #333; font-family: sans-serif; font-weight: bold; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 8px;}
    </style>
</head>
<body>
    <div id="info">Управление: WASD или Стрелки. Тормоз: Пробел</div>
    
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        // Подключаем физический движок
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        // --- 1. ИНИЦИАЛИЗАЦИЯ THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // --- 2. ИНИЦИАЛИЗАЦИЯ CANNON-ES (ФИЗИКА) ---
        const world = new CANNON.World({
            gravity: new CANNON.Vec3(0, -9.81, 0) // Земная гравитация
        });

        // Материал трения (земля - колеса)
        const wheelMaterial = new CANNON.Material('wheel');
        const groundMaterial = new CANNON.Material('ground');
        const wheelGroundContact = new CANNON.ContactMaterial(wheelMaterial, groundMaterial, {
            friction: 0.3,
            restitution: 0,
            contactEquationStiffness: 1000
        });
        world.addContactMaterial(wheelGroundContact);

        // --- 3. СОЗДАНИЕ МИРА (ГРАФИКА + ФИЗИКА) ---
        // Земля (Физика)
        const groundBody = new CANNON.Body({
            type: CANNON.Body.STATIC,
            shape: new CANNON.Plane(),
            material: groundMaterial
        });
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        // Земля (Графика)
        const planeGeometry = new THREE.PlaneGeometry(200, 200);
        const planeMaterial = new THREE.MeshLambertMaterial({ color: 0x55aa55 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Разметка для визуального понимания скорости
        const gridHelper = new THREE.GridHelper(200, 100, 0x000000, 0x000000);
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // --- 4. СОЗДАНИЕ АВТОМОБИЛЯ ---
        // Шасси (Физика)
        const chassisShape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 2)); // Cannon использует полуразмеры (half-extents)
        const chassisBody = new CANNON.Body({ mass: 1500 });
        chassisBody.addShape(chassisShape);
        chassisBody.position.set(0, 4, 0);

        // Настройка RaycastVehicle
        const vehicle = new CANNON.RaycastVehicle({
            chassisBody: chassisBody,
        });

        const wheelOptions = {
            radius: 0.5,
            directionLocal: new CANNON.Vec3(0, -1, 0), // Подвеска смотрит вниз
            suspensionStiffness: 30,
            suspensionRestLength: 0.3,
            frictionSlip: 5,
            dampingRelaxation: 2.3,
            dampingCompression: 4.4,
            maxSuspensionForce: 100000,
            rollInfluence: 0.01,
            axleLocal: new CANNON.Vec3(-1, 0, 0), // Ось вращения колеса
            chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
            maxSuspensionTravel: 0.3,
            customSlidingRotationalSpeed: -30,
            useCustomSlidingRotationalSpeed: true
        };

        // Добавляем 4 колеса (позиции относительно центра шасси)
        wheelOptions.chassisConnectionPointLocal.set(-1, 0, -1.2); // Переднее левое (индекс 0)
        vehicle.addWheel(wheelOptions);
        wheelOptions.chassisConnectionPointLocal.set(1, 0, -1.2);  // Переднее правое (индекс 1)
        vehicle.addWheel(wheelOptions);
        wheelOptions.chassisConnectionPointLocal.set(-1, 0, 1.2);  // Заднее левое (индекс 2)
        vehicle.addWheel(wheelOptions);
        wheelOptions.chassisConnectionPointLocal.set(1, 0, 1.2);   // Заднее правое (индекс 3)

        vehicle.addToWorld(world);

        // Шасси (Графика)
        const carGeometry = new THREE.BoxGeometry(2, 1, 4);
        const carMaterial = new THREE.MeshLambertMaterial({ color: 0xcc2222 });
        const carMesh = new THREE.Mesh(carGeometry, carMaterial);
        carMesh.castShadow = true;
        scene.add(carMesh);

        // Колеса (Графика)
        const wheelMeshes = [];
        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
        wheelGeo.rotateZ(Math.PI / 2); // Поворачиваем цилиндр, чтобы он стал колесом
        const wheelMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        
        for (let i = 0; i < 4; i++) {
            const wheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
            scene.add(wheelMesh);
            wheelMeshes.push(wheelMesh);
        }

        // --- 5. УПРАВЛЕНИЕ ---
        const controls = { forward: false, backward: false, left: false, right: false, brake: false };
        const maxSteerVal = 0.5;
        const maxForce = 3000;
        const brakeForce = 100000;

        window.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': controls.forward = true; break;
                case 'KeyS': case 'ArrowDown': controls.backward = true; break;
                case 'KeyA': case 'ArrowLeft': controls.left = true; break;
                case 'KeyD': case 'ArrowRight': controls.right = true; break;
                case 'Space': controls.brake = true; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': controls.forward = false; break;
                case 'KeyS': case 'ArrowDown': controls.backward = false; break;
                case 'KeyA': case 'ArrowLeft': controls.left = false; break;
                case 'KeyD': case 'ArrowRight': controls.right = false; break;
                case 'Space': controls.brake = false; break;
            }
        });

        // --- 6. ИГРОВОЙ ЦИКЛ ---
        const timeStep = 1 / 60;
        
        function animate() {
            requestAnimationFrame(animate);

            // Обработка логики управления двигателем и рулем
            let engineForce = 0;
            let steeringValue = 0;

            if (controls.forward) engineForce = -maxForce;
            if (controls.backward) engineForce = maxForce;
            if (controls.left) steeringValue = maxSteerVal;
            if (controls.right) steeringValue = -maxSteerVal;

            // Применяем тягу к задним колесам (RWD)
            vehicle.applyEngineForce(engineForce, 2);
            vehicle.applyEngineForce(engineForce, 3);
            
            // Поворачиваем передние колеса
            vehicle.setSteeringValue(steeringValue, 0);
            vehicle.setSteeringValue(steeringValue, 1);

            // Тормоза
            if (controls.brake) {
                vehicle.setBrake(brakeForce, 0);
                vehicle.setBrake(brakeForce, 1);
                vehicle.setBrake(brakeForce, 2);
                vehicle.setBrake(brakeForce, 3);
            } else {
                vehicle.setBrake(0, 0);
                vehicle.setBrake(0, 1);
                vehicle.setBrake(0, 2);
                vehicle.setBrake(0, 3);
            }

            // Шаг физики
            world.step(timeStep);

            // Синхронизация графики шасси с физикой
            carMesh.position.copy(chassisBody.position);
            carMesh.quaternion.copy(chassisBody.quaternion);

            // Синхронизация графики колес с физикой
            for (let i = 0; i < vehicle.wheelInfos.length; i++) {
                vehicle.updateWheelTransform(i);
                const transform = vehicle.wheelInfos[i].worldTransform;
                wheelMeshes[i].position.copy(transform.position);
                wheelMeshes[i].quaternion.copy(transform.quaternion);
            }

            // Плавное следование камеры за машиной
            const cameraOffset = new THREE.Vector3(0, 4, 10);
            cameraOffset.applyQuaternion(carMesh.quaternion); // Вращаем оффсет вместе с машиной
            const targetCameraPos = carMesh.position.clone().add(cameraOffset);
            
            camera.position.lerp(targetCameraPos, 0.1); // 0.1 дает эффект "камеры на резинке"
            camera.lookAt(carMesh.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
